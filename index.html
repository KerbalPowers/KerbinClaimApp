<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerbin Claim Map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23888' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%23888'/></svg>">
<link rel="stylesheet" href="static/css/styles.css">
</head>
<body>

<div id="loader">
  <canvas id="loader-canvas" width="200" height="200"></canvas>
  <p id="loader-msg">Starting…</p>
</div>

<div id="viewport"><div id="world"></div></div>

<div id="left">
  <div class="panel" id="modes">
    <img class="icon logo" id="logo" alt="" hidden>
    <div class="seg" role="tablist">
      <button id="mode-inspect" class="active">Inspect</button>
      <button id="mode-claim">Claim</button>
    </div>
  </div>

  <div class="panel" id="inspect-help"><p class="hint">Click a tile to inspect it. Hold <kbd>Shift</kbd> to see its province as well.</p></div>
  <div class="panel" id="tile-panel" hidden><h3>Tile</h3><div class="rows" id="tile-rows"></div></div>
  <div class="panel" id="prov-panel" hidden><h3 id="prov-title">Province</h3><div class="rows" id="prov-rows"></div></div>

  <div class="panel" id="claim-panel" hidden>
    <input id="claim-name" type="text" placeholder="Enter name…" maxlength="60" autocomplete="off">
    <div class="bar"><div id="claim-fill"></div><span id="claim-pct">0.0%</span></div>
    <div class="rows" id="claim-rows"></div>
    <div class="seg small" id="tap-action" title="What a click or tap does. Right-click always removes.">
      <button data-a="add" class="active">Add</button><button data-a="remove">Remove</button>
    </div>
    <label class="check"><input type="checkbox" id="prevent"> Prevent contest <small id="prevent-note"></small></label>
    <div class="btns">
      <button id="btn-all">Claim All</button>
      <button id="btn-clear"><img class="icon" id="ic-Erase" alt="" hidden>Clear</button>
      <button id="btn-export"><img class="icon" id="ic-Save" alt="" hidden>Export</button>
      <button id="btn-import">Import…</button>
    </div>
    <input type="file" id="file-import" accept="image/png" hidden>
    <p class="hint">Click claims, right-click removes. <kbd>Shift</kbd> = whole province.</p>
  </div>
</div>

<div id="layers" class="panel"></div>
<div id="keys" hidden></div>

<div id="footer">
  <button class="fb" id="btn-fit" title="Reset view">Fit map</button>
  <button class="fb" id="btn-theme" title="Toggle dark / light">Theme</button>
  <span id="footer-note">Drag to pan · wheel to zoom · WASD / arrows</span>
  <a id="footer-link" href="https://github.com/KerbalPowers/KerbinClaimApp" target="_blank" rel="noopener">GitHub ↗</a>
</div>
<div id="toast" role="status"></div>

<script src="static/js/maps.config.js"></script>
<script src="static/js/core.js"></script>
<script src="static/js/sources.js"></script>
<script src="static/js/sheets.js"></script>
<script src="static/js/viewer.js"></script>
<script src="static/js/overlays.js"></script>
<script src="static/js/cities.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>
